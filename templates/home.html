{% extends "base.html" %}

{% block content %}

<div class="card shadow p-4">

    <h2 class="mb-4">
        Patient Portal
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="mb-3">

            <label class="form-label">
                Select Role
            </label>

            {{ form.role }}

        </div>

        <div class="mb-3">

            <label class="form-label">
                Select Patient
            </label>

            {{ form.patient }}

        </div>

        <div class="mb-3">

            <label class="form-label">
                Select Provider
            </label>

            {{ form.provider }}

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            Continue

        </button>

    </form>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="card shadow p-4">

    <h3 class="mb-4">
        Appointment Form
    </h3>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{% url 'provider_dashboard' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
